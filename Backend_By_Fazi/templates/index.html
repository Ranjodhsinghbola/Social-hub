<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed - Social Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="/">Social<span>Hub</span></a>
            </div>
            <div class="nav-search">
                <input type="text" placeholder="Cerca...">
            </div>
            <div class="nav-icons">
                <a href="#"><i class="fas fa-home"></i></a>
                <a href="#"><i class="fas fa-bell"></i></a>
                <a href="#"><i class="fas fa-user"></i></a>
                <a href="/login_page" class="logout-btn"><i class="fas fa-sign-out-alt"></i></a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="feed-container">
            <!-- Sezione per postare -->
            <div class="post-creator card">
                <div class="creator-header">
                    <img src="https://via.placeholder.com/40/222/fff" alt="Avatar" class="avatar">
                    <textarea placeholder="A cosa stai pensando?"></textarea>
                </div>
                <div class="creator-footer">
                    <div class="creator-options">
                        <button class="option-btn"><i class="fas fa-image"></i></button>
                        <button class="option-btn"><i class="fas fa-video"></i></button>
                    </div>
                    <button class="btn-primary post-btn">Pubblica</button>
                </div>
            </div>

            <!-- Feed dei post -->
            <div class="feed">
                <!-- Esempio di Post 1 -->
                <article class="post card">
                    <div class="post-header">
                        <img src="https://via.placeholder.com/40/222/fff" alt="Avatar" class="avatar">
                        <div class="post-info">
                            <h3>Mario Rossi</h3>
                            <span>2 ore fa</span>
                        </div>
                        <button class="more-btn"><i class="fas fa-ellipsis-h"></i></button>
                    </div>
                    <div class="post-content">
                        <p>Oggi è una bellissima giornata per programmare! 🚀 #coding #webdev</p>
                        <img src="https://via.placeholder.com/600x400/333/fff" alt="Post Image" class="post-image">
                    </div>
                    <div class="post-actions">
                        <button class="action-btn like-btn"><i class="far fa-heart"></i></button>
                        <button class="action-btn"><i class="far fa-comment"></i></button>
                        <button class="action-btn"><i class="far fa-share-square"></i></button>
                    </div>
                    <div class="post-comments">
                        <div class="comment-input">
                            <img src="https://via.placeholder.com/30/222/fff" alt="Avatar" class="avatar-sm">
                            <input type="text" placeholder="Scrivi un commento...">
                        </div>
                    </div>
                </article>

                <!-- Esempio di Post 2 -->
                <article class="post card">
                    <div class="post-header">
                        <img src="https://via.placeholder.com/40/222/fff" alt="Avatar" class="avatar">
                        <div class="post-info">
                            <h3>Giulia Bianchi</h3>
                            <span>5 ore fa</span>
                        </div>
                        <button class="more-btn"><i class="fas fa-ellipsis-h"></i></button>
                    </div>
                    <div class="post-content">
                        <p>Qualcuno ha consigli su nuovi framework CSS da provare? 🤔</p>
                    </div>
                    <div class="post-actions">
                        <button class="action-btn like-btn"><i class="fas fa-heart"></i></button>
                        <button class="action-btn"><i class="far fa-comment"></i></button>
                        <button class="action-btn"><i class="far fa-share-square"></i></button>
                    </div>
                </article>
            </div>
        </div>

        <!-- Sidebar destra -->
        <aside class="sidebar-right">
            <div class="card">
                <h3>Suggeriti</h3>
                <ul class="suggestions-list">
                    <li>
                        <img src="https://via.placeholder.com/30/222/fff" alt="Avatar" class="avatar-sm">
                        <span>Luca Verdi</span>
                        <button class="follow-btn">Segui</button>
                    </li>
                    <li>
                        <img src="https://via.placeholder.com/30/222/fff" alt="Avatar" class="avatar-sm">
                        <span>Elena Neri</span>
                        <button class="follow-btn">Segui</button>
                    </li>
                </ul>
            </div>
        </aside>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>\n</body>
</html>
