<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - Social Hub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Social<span>Hub</span></h1>
                <p>Crea un nuovo account per iniziare.</p>
            </div>
            <form class="auth-form">
                <div class="form-group">
                    <label for="fullname">Nome Completo</label>
                    <input type="text" id="fullname" placeholder="Inserisci il tuo nome" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Inserisci la tua email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Crea una password" required>
                </div>
                <button type="submit" class="btn-primary">Registrati</button>
            </form>
            <div class="auth-footer">
                <p>Hai già un account? <a href="/login_page">Accedi</a></p>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='auth-validation.js') }}"></script></body>
</html>
