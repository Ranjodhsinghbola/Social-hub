<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Social Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Social<span>Hub</span></h1>
                <p>Welcome back! Log in to your account.</p>
            </div>
            
            <!-- 固定高度的消息区域 -->
            <div id="message" style="min-height: 60px; margin-bottom: 15px;"></div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <div class="auth-footer">
                <p>Don't have an account? <a href="signin.html">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        function showMessage(message, isSuccess) {
            const msgDiv = document.getElementById('message');
            msgDiv.style.backgroundColor = isSuccess ? '#00c851' : '#ff4444';
            msgDiv.style.color = 'white';
            msgDiv.style.padding = '10px';
            msgDiv.style.borderRadius = '5px';
            msgDiv.innerHTML = (isSuccess ? '✅ ' : '❌ ') + message;
            msgDiv.style.display = 'block';
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === '1') {
            showMessage('Registration complete! You can now log in.', true);
        }
        
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('login_api.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    localStorage.setItem('user_id', result.user_id);
                    localStorage.setItem('username', result.username);
                    localStorage.setItem('email', result.email);
                    localStorage.setItem('join_date', result.created_at || new Date().toLocaleDateString());
                    
                    showMessage('Login successful! Redirecting...', true);
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMessage(result.message, false);
                }
            } catch (error) {
                showMessage('Connection error', false);
            }
        });
    </script>
</body>
</html>
